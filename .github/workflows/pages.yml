# Publishes VANE to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Supply chain: every action is pinned to a full commit SHA (the tag is in the comment; Dependabot proposes
# updates), and each job gets only the permissions it needs.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Default for every job: read the repo, nothing else.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Sub-path, offline and install check (served at /VANE/)
        run: CHROME="$(command -v google-chrome || command -v chromium)" node tests/browser/subpath.mjs
      - name: Update flow (version bump, banner, data survives)
        run: CHROME="$(command -v google-chrome || command -v chromium)" node tests/browser/update.mjs
      - name: Security (CSP, deep links, malicious imports)
        run: CHROME="$(command -v google-chrome || command -v chromium)" node tests/browser/security.mjs
      - name: Data safety (snapshots, rollback, newer data)
        run: CHROME="$(command -v google-chrome || command -v chromium)" node tests/browser/datasafety.mjs
      - name: Install button (every state, both themes, 3 widths)
        run: CHROME="$(command -v google-chrome || command -v chromium)" node tests/browser/install.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build the site (app files only)
        run: node tools/build-site.mjs _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
